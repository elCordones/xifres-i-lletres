<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fons amb vora arrodonida i degradat indi profund -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />

  <!-- Rajola 3D Lletres: 'X' -->
  <g id="tile-letter">
    <!-- Relleu / ombra 3D de la rajola -->
    <rect x="7" y="10" width="23" height="44" rx="6" fill="#94a3b8" />
    <!-- Superfície superior de la rajola blanca -->
    <rect x="7" y="10" width="23" height="40" rx="6" fill="url(#whiteGrad)" />
    <text x="18.5" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#4338ca" text-anchor="middle">X</text>
  </g>

  <!-- Rajola 3D Xifres: '9' -->
  <g id="tile-number">
    <!-- Relleu / ombra 3D de la rajola àmbar -->
    <rect x="34" y="10" width="23" height="44" rx="6" fill="#b45309" />
    <!-- Superfície superior de la rajola àmbar -->
    <rect x="34" y="10" width="23" height="40" rx="6" fill="url(#amberGrad)" />
    <text x="45.5" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>
  </g>
</svg>
